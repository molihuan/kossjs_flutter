name: build_release

# 仅允许手动触发
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 标题 (例如:v1.0.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 使用本项目
      - name: Checkout Code
        uses: actions/checkout@v5
      # windows C++组件
      - name: Install dependencies
        uses: microsoft/setup-msbuild@v2
      #设置flutter
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          # The Flutter version to make available on the path
          flutter-version: 3.35.7
      # 获取 Flutter 依赖
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: example
        shell: bash
      # 构建
      - name: Build Flutter for windows
        run: |
          flutter build windows
        working-directory: example
        shell: bash

      - name: Zip Windows Build
        run: Compress-Archive -Path "example/build/windows/x64/runner/Release/*" -DestinationPath "windows_amd64.zip"
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_amd64.zip

  build-android-harmony:
    runs-on: ubuntu-latest
    # 必须赋予写权限，否则无法创建 Release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # 安装依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        shell: bash

      # 安装鸿蒙工具链
      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      # 配置 Java 环境
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 设置flutter
      - name: Setup flutter-ohos
        run: |
          git clone -b oh-3.35.7-dev https://gitcode.com/openharmony-tpc/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      # 打印 Flutter 版本
      - name: Print Flutter version
        run: flutter doctor -v
        shell: bash

      # 获取 Flutter 依赖
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: example
        shell: bash

      # 构建 ohos
      - name: Build Flutter for ohos
        run: |
          flutter build hap --release
        working-directory: example
        shell: bash
        continue-on-error: true

      # 构建 Android
      - name: Build Flutter for Android
        run: |
          flutter build apk --release --split-per-abi
        working-directory: example
        shell: bash

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            example/app/build/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload HarmonyOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-build
          path: example/ohos/entry/build/default/outputs/default/entry-default-unsigned.hap


  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android-harmony]
    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: Download HarmonyOS Build
        uses: actions/download-artifact@v4
        with:
          name: harmonyos-build

      # 上传到 GitHub Releases
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_name }}
          name: ${{ inputs.release_name }}      # 取自手动触发时填写的标题
          # 使用通配符 *.apk，把 output 目录下所有的分架构包都传上去
          files: |
            app-arm64-v8a-release.apk
            entry-default-unsigned.hap
            windows_amd64.zip
          generate_release_notes: true          # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}