name: kossjs_flutter_example
description: "Demonstrates how to use the kossjs_flutter plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  kossjs_flutter:
    path: ../

  cupertino_icons: ^1.0.8

  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
